# Copy to config/local.toml and edit there. config/local.toml is ignored.

[paths]
# These are expanded by initialize.sh when it generates .env.
petta_root = "$HOME/repos/PeTTa"
# CeTTa checkout used by `/engine cetta`; it must provide `--lang petta`.
cetta_root = "$HOME/repos/CeTTa-runtime"
# Python env PeTTa/swipl links against; install requirements.txt into it.
# Point this at YOUR env -- the name below is only a placeholder.
petta_py_env = "$HOME/miniforge3/envs/petta"

# Optional session-memory helper source. Its Python dependencies must be
# installed in petta_py_env; do not inject another venv into PYTHONPATH.
session_memory_tools = ""

# Mutable transport state lives outside the checkout. This keeps atomic
# offset updates working when the deployed program tree is mounted read-only.
chroma_dir = "$ROOT/chroma_db"
telegram_offset_path = "$STATE_HOME/$INSTANCE/telegram/offset"
telegram_log_path = "$STATE_HOME/$INSTANCE/telegram/updates.jsonl"
prompt_path = "$ROOT/memory/prompt.txt"
history_path = "$ROOT/memory/history.metta"
memory_log_dir = "$ROOT/memory/remembered"
attachments_dir = "$ROOT/memory/attachments"
repos_dir = "$ROOT/repos"

# Local Qwen3-Embedding-8B path. Fill this before using remember/query.
embed_model = ""

[agent]
owner = "$USER"
# Any OpenAI-compatible provider. Put the key in config/secrets.env.
synthetic_base_url = "https://api.synthetic.new/openai/v1"
synthetic_model = "syn:large:text"
# Python transport hard timeout; native transport soft wait, in seconds.
llm_timeout_seconds = 120
# Native waits retain the same request after the soft limit. These are separate
# transport limits; byte activity does not certify a complete model answer.
llm_hard_seconds = 1800
llm_connect_seconds = 30
llm_first_byte_seconds = 900
llm_idle_seconds = 180
# Chat Completions SSE only. Other protocols retain buffered decoding.
llm_stream = true
# Delay for an independent receipt notice while managed input stays queued;
# zero disables notices. Standalone upstream profiles do not send them.
input_ack_seconds = 15
# Ordinary input waits for a turn boundary. /steer invalidates unexecuted work;
# /stop suspends. "legacy" retains the previous arrival freshness policy.
input_policy = "cooperative"
# Read-only CeTTa workers share provider budgets and the foreground allowance.
background_models = 1
background_tokens = 1024
# Top-level commands per model response in godelclaw/coding; a script or
# delegated batch is one command. Iter/Omega retain their upstream dispatch.
command_batch_limit = 5
# Protected work, captured authority and durable action/result correlation in
# managed godelclaw/coding. Standalone Iter/Omega keep their reference loops.
observed_strategy = true
# Optional weighted provider-turn service over memory/goals.metta. Goal review
# is an ordinary recurring goal, configured with a goal-policy record.
fair_goals = false

[channel]
# Communication channel: "telegram" (needs a bot token), "irc", or "mattermost".
kind = "telegram"

[telegram]
allow_private = true
# Identity-bearing Telegram settings belong in config/secrets.env; see its
# example file. This keeps authorization data out of generated .env and Git.

[search]
# "auto" tries Tavily first when TAVILY_API_KEY is set, then DuckDuckGo HTML.
# Use "tavily" or "ddg" to force one provider for the default (search "...").
provider = "auto"

[context]
# Views remain bounded, but their horizons are ordinary replaceable policy.
recent_action_turns = 12
conversation_events = 64
# Optional evidence adapters. Empty means absent, not a machine-specific
# default. A local deployment may point these at an immutable report garden
# and a schema-1 project registry without changing the agent kernel.
reports_root = ""
project_registry_path = ""

[memory]
collection = "memories"
metric = "cosine"
embed_backend = "sentence-transformers"
embed_protocol = "qwen3-embedding-8b-1024-v1"
embed_dim = 1024
embed_device = "auto"
embed_query_prompt_name = "query"
embed_normalize = true
embed_max_tokens = 4096

# Dated remembered-memory JSONL is the canonical event record. Chroma is its
# derived search index; keep rebuildability false until a replay tool exists.
source_of_truth = "remembered-jsonl"
index_is_rebuildable = false
